name: 'Build LintHT image'

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches:
      - jae/feat/cicd-image-build

jobs:
  build-image:
    name: 'Build image from reference.'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 'Restore caches'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ github.ref_name }}
          path: |
            sstate-cache
            tmp
            .ccache

      - name: 'Get repository tool'
        run: |
          sudo curl https://commondatastorage.googleapis.com/git-repo-downloads/repo -O /usr/local/bin/repo
          sudo chmod 755 /usr/local/bin/repo

      - name: 'Initialize NPX and Compulab'
        run: |
          repo init -u https://github.com/nxp-imx/imx-manifest.git -b imx-linux-scarthgap -m imx-6.6.52-2.2.0.xml

          mkdir -p .repo/local_manifests
          wget --directory-prefix .repo/local_manifests https://raw.githubusercontent.com/compulab-yokneam/meta-bsp-imx9/EVAL-MCM-iMX93-2.0.1/scripts/meta-bsp-imx9.xml
          repo sync

      - name: 'Checkout LintHT SDR'
        uses: actions/Checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 'M17-Project/meta-linht-sdr'
          path: 'sources'

      - name: 'Checkout LintHT SDR'
        uses: actions/Checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 'M17-Project/meta-linht-hardware'
          path: 'sources'

      - name: 'Checkout LintHT SDR'
        uses: actions/Checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 'M17-Project/meta-linht-software'
          path: 'sources'

      - name: 'Add Bitbake layers'
        run: |
          source compulab-setup-env build-mcm-imx93

          bitbake-layers add-layer meta-linht-sdr
          bitbake-layers add-layer meta-linht-hardware
          bitbake-layers add-layer meta-linht-software

      - name: 'Setup build cache & packages'
        run: |
          pip install websockets

          cat >> build-mcm-imx93/conf/local.conf <<'EOF'
          BB_HASHSERVE_UPSTREAM = "wss://hashserv.yoctoproject.org/ws"
          SSTATE_MIRRORS ?= "file://.* http://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"
          BB_HASHSERVE = "auto"
          BB_SIGNATURE_HANDLER = "OEEquivHash"

          # Remove distribution features
          DISTRO_FEATURES:remove = "bluetooth wifi"

          # Remove machine features
          MACHINE_FEATURES:remove = "bluetooth wifi"

          # Exclude problematic packages
          PACKAGE_EXCLUDE += "kernel-module-nxp-wlan"
          PACKAGE_EXCLUDE += "bluez5"
          PACKAGE_EXCLUDE += "linux-firmware-bluetooth-bcm4343"

          # Remove from image installation
          IMAGE_INSTALL:remove = "kernel-module-nxp-wlan"
          IMAGE_INSTALL:remove = "bluez5"

          # Disable module autoloading
          KERNEL_MODULE_AUTOLOAD:remove = "bluetooth cfg80211"

          # Force fortran (python3-scipy depends on it)
          FORTRAN:forcevariable = ",fortran"
          EOF

      - name: 'Build image'
        env:
          USE_CCACHE: 1
          CCACHE_DIR: '${{ github.workspace }}/.ccache'
          QT_X11_NO_MITSHM: 1
        run: |
          source compulab-setup-env build-mcm-imx93
          bitbake -k linht-image

      - name: 'Save caches'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ github.ref_name }}
          path: |
            sstate-cache
            tmp
            .ccache

      - name: 'Upload artifacts'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: |
            '**/*.bin-flash_singleboot'
            '**/*..wic.zst'
